spring.application.name=tech-challenge

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/garage_flow}
spring.datasource.username=${DATABASE_USERNAME:garage_flow}
spring.datasource.password=${DATABASE_PASSWORD:garage_flow}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

garage-flow.security.jwt.issuer=${JWT_ISSUER:garage-flow}
garage-flow.security.jwt.secret=${JWT_SECRET:}
garage-flow.security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT15M}
garage-flow.security.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
garage-flow.security.bootstrap.username=${ADMIN_USERNAME:}
garage-flow.security.bootstrap.password=${ADMIN_PASSWORD:}
garage-flow.api.pagination.default-size=${PAGINATION_DEFAULT_SIZE:20}
garage-flow.api.pagination.max-size=${PAGINATION_MAX_SIZE:100}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
