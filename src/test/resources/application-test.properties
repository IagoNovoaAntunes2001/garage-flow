spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

garage-flow.security.jwt.issuer=garage-flow-test
garage-flow.security.jwt.secret=01234567890123456789012345678901
garage-flow.security.jwt.access-token-ttl=PT5M
garage-flow.security.bootstrap.enabled=false
garage-flow.api.pagination.default-size=20
garage-flow.api.pagination.max-size=100

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
