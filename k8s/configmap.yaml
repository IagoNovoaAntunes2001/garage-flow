apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-flow-config
data:
  SPRING_PROFILES_ACTIVE: "default"
  SPRING_CONFIG_IMPORT: "configtree:/mnt/secrets-store/"
  JWT_ISSUER: "garage-flow"
  NOTIFICATIONS_ENABLED: "false"
  MAIL_PORT: "587"
  MAIL_SMTP_AUTH: "true"
  MAIL_SMTP_STARTTLS: "true"
