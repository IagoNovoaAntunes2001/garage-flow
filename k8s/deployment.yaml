apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage-flow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: garage-flow
  template:
    metadata:
      labels:
        app: garage-flow
    spec:
      serviceAccountName: garage-flow
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: backend
          image: garage-flow:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: garage-flow-config
            - configMapRef:
                name: garage-flow-runtime
          volumeMounts:
            - name: application-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
      volumes:
        - name: application-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: garage-flow
