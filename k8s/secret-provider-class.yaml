apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: garage-flow
spec:
  provider: aws
  parameters:
    region: us-east-2
    usePodIdentity: "true"
    objects: |
      - objectName: "garage-flow/database-app"
        objectType: "secretsmanager"
        filePermission: "0444"
        jmesPath:
          - path: "username"
            objectAlias: "DATABASE_USERNAME"
          - path: "password"
            objectAlias: "DATABASE_PASSWORD"
      - objectName: "garage-flow/jwt"
        objectType: "secretsmanager"
        objectAlias: "JWT_SECRET"
        filePermission: "0444"
      - objectName: "garage-flow/bootstrap-admin"
        objectType: "secretsmanager"
        filePermission: "0444"
        jmesPath:
          - path: "username"
            objectAlias: "ADMIN_USERNAME"
          - path: "password"
            objectAlias: "ADMIN_PASSWORD"
      - objectName: "garage-flow/integration"
        objectType: "secretsmanager"
        objectAlias: "QUOTATION_INTEGRATION_SECRET"
        filePermission: "0444"
