name: Plan AWS infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: codebuild-${{ vars.CODEBUILD_PLAN_PROJECT_NAME }}-${{ github.run_id }}-${{ github.run_attempt }}
    environment: aws-plan
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
      - name: Initialize and validate
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          terraform fmt -check
          terraform init -input=false -backend-config="bucket=$STATE_BUCKET" -backend-config="key=garage-flow/terraform.tfstate" -backend-config="region=$AWS_REGION" -backend-config="use_lockfile=true"
          terraform validate
      - name: Plan cluster and database
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_kubernetes_version: ${{ vars.EKS_KUBERNETES_VERSION }}
          TF_VAR_eks_public_access_cidrs: ${{ vars.EKS_PUBLIC_ACCESS_CIDRS }}
          TF_VAR_enable_gateway: 'true'
          TF_VAR_jwt_secret_arn: ${{ vars.JWT_SECRET_ARN }}
          TF_VAR_enable_codebuild_runner: 'true'
          TF_VAR_github_connection_arn: ${{ vars.CODECONNECTION_ARN }}
          TF_VAR_github_deploy_actor_id: ${{ vars.DEPLOY_ACTOR_ID }}
          TF_VAR_terraform_state_bucket: ${{ vars.TF_STATE_BUCKET }}
        run: terraform plan -input=false -no-color
