name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew --no-daemon build koverVerify
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          if-no-files-found: ignore
      - name: Test database plan guard
        run: python3 -m unittest discover -s infra/scripts -p 'test_*.py'
      - name: Test Lambda authorizer
        run: python3 -m unittest discover -s infra/authorizer -p 'test_*.py'
      - name: Build container image
        run: docker build -t garage-flow:ci .
      - name: Scan image for critical vulnerabilities
        run: |
          docker save -o "$RUNNER_TEMP/garage-flow-image.tar" garage-flow:ci
          docker run --rm -v "$RUNNER_TEMP/garage-flow-image.tar:/input/image.tar:ro" ghcr.io/aquasecurity/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c image --scanners vuln --severity CRITICAL --exit-code 1 --input /input/image.tar

  karpenter:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (vars.KARPENTER_ENABLED == 'true' || vars.AWS_DEPLOY_ENABLED == 'true')
    concurrency:
      group: garage-flow-infrastructure
      cancel-in-progress: false
    runs-on: codebuild-${{ vars.CODEBUILD_KARPENTER_PROJECT_NAME }}-${{ github.run_id }}-${{ github.run_attempt }}
    environment: aws-infrastructure
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm this is the current main commit
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || { echo 'A newer release is already on main.'; exit 1; }
      - uses: azure/setup-kubectl@v4
        with:
          version: ${{ vars.KUBECTL_VERSION }}
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.18.6
      - name: Install the AWS Secrets Store provider
        env:
          CLUSTER: ${{ vars.EKS_CLUSTER_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"
          kubectl rollout status daemonset/eks-pod-identity-agent -n kube-system --timeout=3m
          helm repo add secrets-store-csi-driver https://kubernetes-sigs.github.io/secrets-store-csi-driver/charts
          helm repo add aws-secrets-manager https://aws.github.io/secrets-store-csi-driver-provider-aws
          helm upgrade --install csi-secrets-store secrets-store-csi-driver/secrets-store-csi-driver --version 1.6.1 --namespace kube-system --set 'tokenRequests[0].audience=sts.amazonaws.com' --set 'tokenRequests[1].audience=pods.eks.amazonaws.com' --wait --timeout 5m
          helm upgrade --install secrets-provider-aws aws-secrets-manager/secrets-store-csi-driver-provider-aws --version 3.1.4 --namespace kube-system --set secrets-store-csi-driver.install=false --wait --timeout 5m
          kubectl apply -f k8s/service-account.yaml -f k8s/secret-provider-class.yaml
      - name: Install Karpenter and configure its node pool
        if: vars.KARPENTER_ENABLED == 'true'
        env:
          CLUSTER: ${{ vars.EKS_CLUSTER_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"
          kubectl rollout status daemonset/eks-pod-identity-agent -n kube-system --timeout=3m
          helm upgrade --install karpenter oci://public.ecr.aws/karpenter/karpenter --version 1.15.1 --namespace kube-system --values k8s/karpenter/values.yaml --set "settings.clusterName=$CLUSTER" --wait --timeout 5m
          kubectl apply -f k8s/karpenter/nodeclass.yaml -f k8s/karpenter/nodepool.yaml
          kubectl wait --for=condition=Ready ec2nodeclass/garage-flow --timeout=3m
          kubectl wait --for=condition=Ready nodepool/garage-flow --timeout=3m

  database:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DATABASE_PROVISION_ENABLED == 'true'
    concurrency:
      group: garage-flow-database
      cancel-in-progress: false
    runs-on: codebuild-${{ vars.CODEBUILD_DATABASE_PROJECT_NAME }}-${{ github.run_id }}-${{ github.run_attempt }}
    environment: aws-database
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm this is the current main commit
        working-directory: .
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || { echo 'A newer release is already on main.'; exit 1; }
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - name: Plan and apply approved database changes
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_kubernetes_version: ${{ vars.EKS_KUBERNETES_VERSION }}
          TF_VAR_cluster_admin_role_arn: ${{ vars.CLUSTER_ADMIN_ROLE_ARN }}
          TF_VAR_eks_public_access_cidrs: ${{ vars.EKS_PUBLIC_ACCESS_CIDRS }}
          TF_VAR_enable_gateway: 'true'
          TF_VAR_jwt_secret_arn: ${{ vars.JWT_SECRET_ARN }}
          TF_VAR_enable_codebuild_runner: 'true'
          TF_VAR_enable_database_runner: ${{ vars.DATABASE_RUNNER_INFRA_ENABLED }}
          TF_VAR_enable_karpenter: ${{ vars.KARPENTER_INFRA_ENABLED || 'false' }}
          TF_VAR_github_connection_arn: ${{ vars.CODECONNECTION_ARN }}
          TF_VAR_github_deploy_actor_id: ${{ vars.DEPLOY_ACTOR_ID }}
          TF_VAR_terraform_state_bucket: ${{ vars.TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          test "$TF_VAR_enable_database_runner" = true
          umask 077
          plan_file=$(mktemp "$RUNNER_TEMP/database-plan.XXXXXX")
          trap 'rm -f "$plan_file"' EXIT
          terraform init -input=false -backend-config="bucket=$STATE_BUCKET" -backend-config="key=garage-flow/terraform.tfstate" -backend-config="region=$AWS_REGION" -backend-config="use_lockfile=true"
          terraform plan -input=false -no-color -out="$plan_file"
          terraform show -json "$plan_file" | python3 scripts/check_database_plan.py
          terraform apply -input=false -no-color "$plan_file"

  deploy:
    needs: [build, karpenter, database]
    if: always() && needs.build.result == 'success' && (needs.karpenter.result == 'success' || needs.karpenter.result == 'skipped') && (needs.database.result == 'success' || needs.database.result == 'skipped') && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ENABLED == 'true'
    concurrency:
      group: garage-flow-deploy
      cancel-in-progress: false
    runs-on: codebuild-${{ vars.CODEBUILD_PROJECT_NAME }}-${{ github.run_id }}-${{ github.run_attempt }}
    environment: aws
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm this is the current main commit
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || { echo 'A newer release is already on main.'; exit 1; }
      - uses: azure/setup-kubectl@v4
        with:
          version: ${{ vars.KUBECTL_VERSION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and publish image
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_URL }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker build -t "$ECR_REPOSITORY:$IMAGE_TAG" .
          docker save -o "$RUNNER_TEMP/garage-flow-image.tar" "$ECR_REPOSITORY:$IMAGE_TAG"
          docker run --rm -v "$RUNNER_TEMP/garage-flow-image.tar:/input/image.tar:ro" ghcr.io/aquasecurity/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c image --scanners vuln --severity CRITICAL --exit-code 1 --input /input/image.tar
          docker push "$ECR_REPOSITORY:$IMAGE_TAG"
      - name: Check database and configure cluster access
        env:
          DB_INSTANCE: ${{ vars.RDS_INSTANCE_ID }}
          CLUSTER: ${{ vars.EKS_CLUSTER_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          aws rds wait db-instance-available --db-instance-identifier "$DB_INSTANCE"
          aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"
      - name: Configure runtime and deploy manifests
        env:
          DB_INSTANCE: ${{ vars.RDS_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_URL }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          database_host=$(aws rds describe-db-instances --region "$AWS_REGION" --db-instance-identifier "$DB_INSTANCE" --query 'DBInstances[0].Endpoint.Address' --output text)
          test -n "$database_host"
          kubectl apply -f k8s/configmap.yaml -f k8s/runtime-config.yaml -f k8s/service.yaml -f k8s/hpa.yaml
          kubectl create configmap garage-flow-runtime --from-literal="DATABASE_URL=jdbc:postgresql://$database_host:5432/garageflow" --dry-run=client -o yaml | kubectl apply -f -
          kubectl set image --local -f k8s/deployment.yaml backend="$ECR_REPOSITORY:$IMAGE_TAG" -o yaml | kubectl apply -f -
          kubectl rollout status deployment/garage-flow --timeout=5m
          kubectl delete secret garage-flow-secrets --ignore-not-found
